# 1-tun — "Koʻchib kelish"
#
# Bu faylni bemalol tahrirlang. Qoidalar:
#   - Kalitlarni (n1_start, l1, c_clock …) oʻzgartirmang, faqat matnni.
#   - l1, l2 … — sahnadagi qatorlar tartibi. l3_unutilish kabi kalit — shart bilan
#     chiqadigan variant (sharti SCRIPT_UZ.md da yozilgan).
#   - c_… — tanlov tugmasi matni.
#   - Kim gapirayotgani qator oxiridagi izohda: # rustam, # ovoz, # onam, # siz …
#   - Oʻzgartirgach: npm run text:build (SCRIPT_UZ.md ham yangilanadi), keyin npm run lint:text.

n1_start:
  l1: Chilonzordagi toʻqqiz qavatli panel uy, toʻrtinchi qavat.
  l2: Zinapoyada chiroq yoʻq edi, telefon chirogʻida chiqib keldingiz. Smenadan keyin oyoqlaringiz oʻzingizniki emasdek.
  l3: Mana kalit. Tok ba’zan oʻchib turadi, sham shkafda bor. Yana bitta gap — qirq sakkizga e’tibor bermang, u yerda hech kim turmaydi. # rustam
  l4: U kalitni qoʻlingizga tutqazdi-yu, pasportingizni ham soʻramay, zinadan tushib ketdi.
  l5: Kalit iliq edi. Uni ancha vaqt qoʻlida siqib turgan boʻlsa kerak.

n1_hub:
  l1: Xona sovuq, lekin toza. Polda hali hoʻl latta hidi bor, kimdir sizdan oldin yuvib ketgan.
  c_clock: Devordagi soatga qarash
  c_note: Stol ustidagi xatni oʻqish
  c_radiator: Radiatorni ushlab koʻrish
  c_tv: Televizorni yoqish
  c_window: Derazadan qarash
  c_phone: Telefonga qarash
  c_tea: Oshxonaga oʻtib, choy qoʻyish
  c_sleep: Chiroqni oʻchirib yotish

n1_clock:
  l1: Devorda katta soat osilib turibdi, oynasi changli, yogʻoch gardishi qorayib ketgan.
  l2: Millari uchdan oʻn yetti daqiqa oʻtganda toʻxtab qolgan.
  l3_unutilish: Negadir tugʻilgan kuningiz esingizga tushdi. Oxirgi marta uni kim bilan nishonlagan edingiz?
  l3: Orqasidagi batareya joyi boʻsh. Batareyani kimdir ataylab olib qoʻygan.

n1_note:
  l1: Stol ustida buklangan qogʻoz yotibdi. Rustam akaning qoʻli, shoshib yozilgan.
  l2: Ijara oyiga ikki yarim million, har oyning beshinchisigacha. Kommunalni oʻzim toʻlayman. # rustam (xat)
  l3: Kechasi eshikni zanjirlab yoting va kim chaqirsa ham ochmang. # rustam (xat)
  l4: Ismingizni aytib chaqirsa ham. # rustam (xat)
  l5: Oxirgi gap boshqa ruchkada yozilgan, xuddi keyinroq eslab qoʻshilgandek.

n1_radiator:
  l1: Choʻyan radiatorning ustida eski paypoq izi qolgan, issigʻi esa zoʻrgʻa seziladi.
  l2: Ichida suv shildirab oqdi, keyin bir marta quruq taq etdi.
  l3: Panel uylarda radiator doim shunaqa qiladi. Uyda ham shunaqa edi.

n1_tv:
  l1: Yogʻoch qutili eski «Rubin» televizori, antennasi skotch bilan yopishtirilgan.
  l2: Yoqdingiz. Ekranda oq-qora «qor» shitirlay boshladi.
  l3: Shitirlash orasida kimdir bir marta yoʻtaldi.
  l4: 'Oʻchirdingiz. Qoramtir ekranda xona aks etdi: divan, gilam va ortingizdagi ochiq eshik.'

n1_window:
  l1: Roʻparada xuddi shunday toʻqqiz qavatli uy, qator-qator derazalari qorongʻi.
  l2: Pastda yolgʻiz koʻcha chirogʻi yonib turibdi, uning sariq doirasida qor aylanadi.
  l3: Roʻparadagi toʻrtinchi qavatda bitta deraza yorugʻ. Pardasi yoʻq, lekin ichida hech kim koʻrinmaydi.

n1_phone:
  l1: Telefon stol ustida, quvvatlagichga ulangan holda yotibdi.
  l2: Ekranda «Onam — 3 ta javobsiz qoʻngʻiroq» degan yozuv, ostida bitta ovozli xabar.
  c_hear: Ovozli xabarni eshitish
  c_later: Keyinroq eshitaman, deb telefonni qoʻyish

n1_message:
  l1: Bolam, yetib bordingmi? Uy issiqmi oʻzi? Bir ogʻiz yozib qoʻy, xavotir olyapman. # onam
  l2: Xabar oʻn bir soniya davom etdi. Oxirida u yana nimadir demoqchi boʻldi, lekin yozuv uzilib qoldi.
  l3: Javob yozmoqchi boʻldingiz, ammo barmogʻingiz ekran ustida qotib qoldi.

n1_tea:
  l1: 'Oshxona tor: plita, muzlatgich va bitta taburetka. Muzlatgich bir tekis gʻuvillab turibdi.'
  l2: Choynakni olovga qoʻyib, gazning koʻk tili yonida qoʻllaringizni isitdingiz.
  l3: Birinchi qultumdan keyin yelkalaringiz pastga tushdi. Ularni qachondan beri koʻtarib yurgan ekansiz?

n1_316:
  l1: Yotdingiz, lekin uyqu kelmadi. Telefonda soat 3:16.
  l2: Roʻparadagi uyda derazalar pastdan yuqoriga, qavatma-qavat, birin-ketin oʻchyapti.
  l3: Toʻrtinchi qavatdagi deraza hammasidan keyin oʻchdi.

n1_317:
  l1: '3:17.'
  l2: Chiroq oʻchdi va muzlatgich gʻuvillashdan toʻxtadi.
  l3: Uy shu qadar jim boʻldiki, qulogʻingiz oʻz-oʻzidan biror tovush qidira boshladi.
  l4: Keyin oʻng tomondagi devor uch marta taqilladi.

n1_knocks:
  l1: Bu devorning ortida qirq sakkizinchi xonadon turibdi.
  l2: Qoʻshni… uxlamayapsizmi? # ovoz
  c_answer: «Yoʻq, uxlayapman», deyish
  c_silent: Indamay yotish
  c_knock_back: Devorni uch marta taqillatish

n1_answer:
  l1: Yoʻq… uxlayapman. # siz
  l2: Gapingiz ahmoqona chiqdi, chunki uxlayotgan odam javob bermaydi.
  l3: Men ham. # ovoz
  l4_yolgiz: Yolgʻiz odam kechasi har bir tovushni eshitadi. Toʻgʻrimi? # ovoz
  l4: Yaxshi tush koʻring, qoʻshni. # ovoz
  l5: Tong otguncha devorga tikilib yotdingiz.

n1_silent:
  l1: 'Nafasingizni ichingizga yutdingiz. Bolalikda qorongʻida xuddi shunday yotardingiz: qimirlamasang, koʻrishmaydi.'
  l2_yopiq: Eshigingiz yopiq ekan. Yaxshi, men ham yopib yotaman. # ovoz
  l2: Mayli. Ertaga gaplasharmiz. # ovoz
  l3: Boshqa tovush boʻlmadi, siz esa tong otguncha qimirlamadingiz.

n1_knock_back:
  l1: Musht bilan devorga uch marta urdingiz, barmoq boʻgʻinlaringiz achishib ketdi.
  l2: Devor ortida uzoq jimlik choʻkdi.
  l3: Rahmat. Javob berganingiz uchun. # ovoz
  l4: Siz esa hech narsa demagan edingiz.

n1_sleep:
  l1: Tong otdi. Tok qaytdi, muzlatgich yana gʻuvillay boshladi.
  l2: Devordagi soat esa hamon oʻsha vaqtni koʻrsatib turibdi.
  l3: Telefonni ekrani bilan pastga qaratib qoʻydingiz.

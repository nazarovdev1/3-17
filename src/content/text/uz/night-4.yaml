# 4-tun — "48"
# Qoidalar night-1.yaml boshida. Bu tunda ovoz onaning soʻzlari bilan gapiradi.

n4_start:
  l1: Ishxonadan yana xabar keldi — «Ertaga kelmasangiz, oʻrningizga boshqa odam olamiz.»
  l2: Javob yozmadingiz, telefonni yostiq ostiga tiqib qoʻydingiz.
  l3: Dahlizda nimadir shitirladi, xuddi kimdir polda nimanidir sudrab oʻtgandek.

n4_hub:
  l1_qorongi: Atrof qorongʻi, derazadan faqat koʻcha chirogʻining sariq nuri tushyapti.
  l1: Yostiq ostida telefon bir-ikki titrab qoʻydi.
  c_phone: Telefonni yostiq ostidan olish
  c_carpet: Dahlizdagi koʻtarilgan taxtani ochish
  c_tea: Choy qoʻyish
  c_wait: Tokning oʻchishini kutish
  c_peephole: Eshik koʻzidan qarash
  c_corridor: Maydonchaga chiqish
  c_sleep: Hech qayoqqa chiqmay, yotish

n4_phone:
  l1: Ekran yorishdi. Javobsiz qoʻngʻiroqlar soni qirqqa yetibdi, oxirgisi — 23:58. Yangi ovozli xabar ham bor.
  c_hear: Ovozli xabarni eshitish
  c_later: Keyinroq eshitaman, deb telefonni qoʻyish

n4_message:
  l1: Bolam… Shuhrat akaning mashinasida ovqat berib yubordim. Somsa, qatlama, bir banka qatiq. # onam
  l2: Eshigingga qoʻyib ketadi, olib qolarsan. # onam
  l3: …Eshityapsanmi? Mayli. Sogʻ boʻl. # onam
  l4: Uning «mayli» degani uzoq choʻzilib qoldi.

n4_tea:
  l1: Choy qoʻydingiz. Gazning koʻk alangasi devorga titroq soya tashlayapti.
  l2: Piyoladagi choy titrab turibdi. Yoki qoʻlingiz titrayaptimi?

n4_317:
  l1: '3:17. Tok yana ketdi va muzlatgich tindi.'
  l2: Taqillash boʻlmadi. Uning oʻrniga maydonchadan bitta qadam tovushi keldi, keyin yana jimlik.

n4_peephole:
  l1: Eshik koʻzidan qaradingiz. Maydoncha egilib, xira shar ichiga yigʻilib qolgan.
  l2: Zinapoya yonida baland boʻyli kimdir turibdi. Egnida uzun palto, orqasi sizga qaragan.
  l3: Koʻzingizni olib, yana qaradingiz. Hech kim yoʻq.
  l4: Faqat beton polda qirq sakkizinchi eshik tomon ketgan hoʻl izlar qolibdi.

n4_diary6:
  l1: Kecha koʻtarilib qolgan taxtani qoʻporib oldingiz, tagidan qogʻoz chiqdi.
  l2: «Qirq sakkizga kirdim. U yerda mening stulim bor, mening piyolam bor, hatto tirnalgan joyi ham bir xil.» # kundalik
  l3: «Bu yerda meni hech kim kutmaydi. U yerda esa kutishadi.» # kundalik

n4_door48:
  l1: Maydonchada sovuq. Lift ishlamaydi, zinapoya zim-ziyo.
  l2_olingan: Ostonada hech narsa yoʻq, tugun ichkarida, stol ustida turibdi.
  l2: 'Ostonangizda tugun turibdi: somsa, qatlama, bir banka qatiq. Tugun hali iliq.'
  l3: Qirq sakkizinchi eshik qiya ochiq. Muhr qogʻozi yirtilgan, yarmi yerda yotibdi.
  c_enter: Qirq sakkizga kirish
  c_retreat: Tugunni olib, ichkariga qaytish

n4_retreat:
  l1: Tugunni ichkariga olib kirdingiz va qatlamadan bir tishlab koʻrdingiz. Uyning ta’mi.
  l2: Eshikni zanjirladingiz. Qirq sakkizning eshigi esa ochiqligicha qoldi.

n4_inside48:
  l1: Ichkarida sovuq va chang hidi. Gilam, divan, soat — hammasi xuddi sizning xonangizdagidek.
  l2: Faqat bu yerda hammasi eskirib ketgan. Devor qogʻozi koʻchib tushgan, gilamning rangi oʻchgan.
  l3: Soat bu yerda ham oʻsha vaqtda toʻxtab qolgan.

n4_copy_room:
  l1: Koʻzingiz qorongʻiga asta koʻnikib boryapti.
  c_calendar: Devordagi kalendarni koʻrish
  c_belongings: Divandagi sumkani ochish
  c_diary: Stuldagi qogʻozni olish
  c_glitch: Yotoq tomonga yurish

n4_calendar:
  l1: Devorda yirtma kalendar osilgan. Yili yozilmagan, faqat oy va kunlar bor.
  l2: Kunlar birma-bir chizib chiqilgan, oxirgisi — kecha.
  l3: Bugungi kun hali chizilmagan. Yonida ipga bogʻlangan ruchka osilib turibdi.

n4_belongings:
  l1: Divanda sumka yotibdi. Sizning sumkangiz — yirtilgan bandi oq ip bilan tikilgan.
  l2: 'Ichida pasport. Rasmda siz, ismi ham sizniki: {name}.'
  l3: Pasportni qalin chang bosgan, goʻyo uni yillar davomida hech kim qoʻzgʻatmagan.

n4_diary5:
  l1: Stul ustida bir varaq qogʻoz. Xati shkafdagi qogʻozniki bilan bir xil.
  l2: «Bugun onam keldi va eshik oldida oʻtirdi. Men ichkarida edim. Ochmadim.» # kundalik
  l3: «Kechqurun u ketdi. Zinada uning qadamlari uzoq eshitilib turdi.» # kundalik

n4_glitch:
  l1: Yotoq tomonga yurdingiz. Qorongʻida nimadir qimirladi.
  l2: Koʻz oldingiz chayqalib, tasvir surilib ketdi, devor chiziqlari bir-biriga tutashmay qoldi.
  l3: Keyin hammasi joyiga tushdi, lekin bir lahza eshik qaysi tomonda ekanini eslay olmadingiz.

n4_voice_identity:
  l1: Bu safar ovoz devor ortidan emas, shu xonaning oʻzidan keldi.
  l2: Bolam, nega telefonni olmayapsan? # ovoz (onaning soʻzlari)
  l3: Ovoz onangizniki emas edi. Soʻzlar esa uniki.
  l4_eshitmagan: Siz bu xabarni eshitmagan edingiz. U eshitgan.
  l4: Bu soʻzlarni kecha, qorongʻi xonada, telefondan eshitgan edingiz.
  l5: Ovqat qilyapsanmi oʻzi? Issiq kiyin, shamollab qolma. # ovoz (onaning soʻzlari)
  c_who: «Sardormisan?» deb soʻrash
  c_why: «Bu gaplarni qayerdan bilasan?» deb soʻrash
  c_no_talk: Indamaslik

n4_ask_sardor:
  l1: Sen… Sardormisan? # siz
  l2: Sardor edim. Keyin qoʻshni boʻlib qoldim. # ovoz
  l3: Bu yerda ism uzoq turmaydi. Meni Sardor deb faqat onam chaqirardi. # ovoz

n4_why:
  l1: Bu gaplarni qayerdan bilasan? # siz
  l2: Telefoning yostiq ostida yotadi. Yostiq esa devorga tegib turadi. # ovoz
  l3: Sen eshitmaganni men eshitaman. Kimdir eshitishi kerak-ku. # ovoz

n4_no_talk:
  l1: Indamadingiz va orqaga, eshik tomon yurdingiz.
  l2: Ertaga yana kelasan. Hamma ertaga yana keladi. # ovoz

n4_return:
  l1: 'Oʻz xonangizga qaytdingiz va eshikdagi raqamga qaradingiz: 47.'
  l2: Kaftlaringiz chang boʻlib qolgan, ularni yuvishga ham kuchingiz yetmadi.
  l3_olingan: Tugun stol ustida turibdi. Unga qoʻl tekkizmadingiz.
  l3: Tugun ostonada qolib ketdi. Ertalab u yerda yoʻq edi.

n4_sleep:
  l1: Uxlay olmadingiz. Yostiq ostida telefon bir necha marta titradi.
  l2: Siz olmadingiz.

# Oʻyin dunyosidagi soʻzlar (SCRIPT_UZ.md dan). Kalitlar — SCRIPT_UZ.md dagi ID lar.
# Bir ID da bir nechta qator boʻlsa: ID.1, ID.2 … Faqat matnni oʻzgartiring.

n1:
  N1-01: Mana kalit.
  N1-02: Tok ba’zan oʻchib turadi, sham shkafda bor.
  N1-03: Yana bitta gap — qirq sakkizga e’tibor bermang.
  N1-04: U yerda hech kim turmaydi.
  N1-08: Bolam, yetib bordingmi? Uy issiqmi oʻzi? Bir ogʻiz yozib qoʻy, xavotir olyapman.
  N1-09: Ijara oyiga ikki yarim million, har oyning beshinchisigacha. Kommunalni oʻzim toʻlayman.
  N1-10: Kechasi eshikni zanjirlab yoting va kim chaqirsa ham ochmang.
  N1-11: Ismingizni aytib chaqirsa ham.
  N1-12: Qoʻshni… uxlamayapsizmi?
  N1-13a.1: Yoʻq… uxlayapman.
  N1-13a.2: Men ham.
  N1-13a.3: Yolgʻiz odam kechasi har bir tovushni eshitadi. Toʻgʻrimi?
  N1-13b: Eshigingiz yopiq ekan. Yaxshi, men ham yopib yotaman.
  N1-13c: Mayli. Ertaga gaplasharmiz.
  N1-13d: Rahmat. Javob berganingiz uchun.
  N1-13e: Yaxshi tush koʻring, qoʻshni.

n2:
  N2-02: Voy, bolam, oʻsha qirq yettiga koʻchdingmi?
  N2-03: Kel, kel, halva ol, hali issiq.
  N2-04: Men Muhabbat opangman. Qirq yildan beri shu uydaman.
  N2-05: Oʻzing qayerdansan? Yolgʻiz turasanmi?
  N2-06: Qirq sakkiz? Voy, uni gapirma, yigirma yildan beri yopiq.
  N2-07: Ikki ming oltinchi yili muhrlab ketishgan.
  N2-08: Ba’zan kechasi u yoqdan televizor ovozi keladi.
  N2-09: Sendan oldin Sardor degan bola turardi. Qishloqdan kelgan.
  N2-10: Keyin uydan chiqmay qoʻydi. «Qoʻshnim bilan gaplashaman», derdi.
  N2-11: Qirq sakkizda u paytda ham hech kim yoʻq edi.
  N2-12: Onasi kelib, eshik oldida soatlab kutardi. Sardor ochmasdi.
  N2-13: Bir kuni yoʻq boʻlib qoldi.
  N2-14: Onangga qoʻngʻiroq qilib tur, xoʻpmi? Onalar kutadi.
  N2-16: 'Bolam, otang soʻrayapti: pul yetyaptimi? Ovqat qilyapsanmi oʻzi? Yetmasa ayt, uyalma.'
  N2-17: Bizda qor yogʻdi. Sen tomonda ham yogʻdimi? Issiq kiyin, shamollab qolma.
  N2-19a: Kecha javob berdingiz. Ovozingiz charchagan ekan.
  N2-19b: Kecha indamadingiz, lekin uxlamadingiz ham. Bilaman.
  N2-19c: Kecha devorni urdingiz. Uch marta. Men sanadim.
  N2-20a: Yolgʻiz yashaysiz-a? Men ham.
  N2-20b: '«Hozircha», debsiz. Bu «hozircha» qancha davom etadi?'
  N2-20c: Yolgʻiz emasman, debsiz. Unda nega hech kimga qoʻngʻiroq qilmaysiz?
  N2-21a: Qorongʻidan qoʻrqasiz. Men ham qoʻrqardim, keyin koʻnikdim.
  N2-21b: Yolgʻizlikdan qoʻrqasiz. Endi yolgʻiz emassiz, men borman-ku.
  N2-21c: Kimdir kuzatayotgandek tuyuladi sizga. Toʻgʻri tuyuladi.
  N2-21d: Unutilishdan qoʻrqasiz. Men sizni unutmayman.

diary:
  K-1: Bugun yana uch marta taqilladi, javob bermadim. Onam ham qoʻngʻiroq qildi. Unga ham javob bermadim.
  K-2: Bugun ishga bormadim, kecha ham. Devor ortidagi odam meni tushunadi, boshqalar tushunmaydi.
  K-3: U mening gaplarimni qaytaryapti. Men aytgan gaplarni — lekin men ularni unga aytmaganman.
  K-4: Onamga qoʻngʻiroq qilish kerak. Ertaga. Ertaga albatta.
  K-5: Bugun onam keldi va eshik oldida oʻtirdi. Men ichkarida edim. Ochmadim. Kechqurun u ketdi. Zinada uning qadamlari uzoq eshitilib turdi.
  K-6: Qirq sakkizga kirdim. U yerda mening stulim bor, mening piyolam bor, hatto tirnalgan joyi ham bir xil. Bu yerda meni hech kim kutmaydi. U yerda esa kutishadi.
  K-7: 'Soatni burash kerak edi. Men qoʻrqdim: soat yursa, men ham yurishim kerak boʻladi. Kalit dastada turibdi. Har kecha qoʻlimga olaman, har kecha qaytarib qoʻyaman. Ismim Sardor. Buni ham unutib qoʻymay deb yozib qoʻydim.'

n3:
  N3-02: Bugun ham kelmaysizmi?
  N3-04: Alo, hammasi joyidami?
  N3-05: Muhabbat opa sizga nimadir dedimi? U kishi koʻp gapiradi.
  N3-06: Ijarani beshinchigacha bersangiz boʻldi. Xayr.
  N3-08: Bolam, nega telefonni olmayapsan?
  N3-09: Kecha tushimda koʻrdim seni. Kichkina ekansan, qorda yalangoyoq turgan ekansan.
  N3-10: Bir ogʻiz «yaxshiman» deb yoz, boshqa hech narsa kerakmas.
  N3-11a.1: '«Yoʻq, uxlayapman». Esingdami?'
  N3-11a.2: Men ham birinchi kechasi shunday degandim.
  N3-11b.1: Birinchi kechasi men ham indamagandim.
  N3-11b.2: Qimirlamasang, koʻrishmaydi, deb oʻylagandim.
  N3-11c: Birinchi kechasi men ham devorni urgandim. Uch marta.
  N3-12a: Muhabbat opa senga Sardor haqida gapirdi-a?
  N3-12b: Muhabbat opa senga halva berdi-a? Menga ham bergan.
  N3-13a: '«Ertaga», deysan. Men ham doim «ertaga» derdim.'
  N3-13b: Sen menga oʻxshab qolyapsan.
  N3-14a.1: Sen… kimsan?
  N3-14a.2: Qoʻshningman. Devorning u tomonidagi qoʻshning.
  N3-14a.3: Yaqinda sen ham kimgadir qoʻshni boʻlasan.
  N3-14b: Mayli, gaplashmasak ham boʻladi. Men shu yerdaman.

n4:
  N4-01: Ertaga kelmasangiz, oʻrningizga boshqa odam olamiz.
  N4-04: Bolam… Shuhrat akaning mashinasida ovqat berib yubordim. Somsa, qatlama, bir banka qatiq.
  N4-05: Eshigingga qoʻyib ketadi, olib qolarsan.
  N4-06: …Eshityapsanmi? Mayli. Sogʻ boʻl.
  N4-09: Bolam, nega telefonni olmayapsan?
  N4-10: Ovqat qilyapsanmi oʻzi? Issiq kiyin, shamollab qolma.
  N4-11a.1: Sen… Sardormisan?
  N4-11a.2: Sardor edim. Keyin qoʻshni boʻlib qoldim.
  N4-11a.3: Meni Sardor deb faqat onam chaqirardi.
  N4-11b.1: Buni qayerdan bilasan?
  N4-11b.2: Telefoning yostiq ostida yotadi. Yostiq devorga tegib turadi.
  N4-11b.3: Sen eshitmaganni men eshitaman.
  N4-11c: Ertaga yana kelasan. Hamma ertaga yana keladi.

n5:
  N5-03: Bolam, endi koʻp qoʻngʻiroq qilmayman, bezor qilmay.
  N5-04: 'Faqat bilib qoʻy: eshigimiz ochiq. Kelsang ham, kelmasang ham, qachon boʻlsa ham.'
  N5-05a: '«Yaxshiman, ona. Ishdaman». Yozganding, lekin joʻnatmading.'
  N5-05b: '«Yaxshiman, ona. Ishdaman». Joʻnatding. Rost emasdi-ku.'
  N5-06a: '«Sardormisan?» deb soʻraganding. Sardor shu yerda. Sen ham kelasan.'
  N5-06b: '«Buni qayerdan bilasan?» deganding. Endi bilasan.'
  N5-06c: '{name}. Ismingni hamma unutadi, men esa unutmayman.'
  N5-07: Eshikni och.
  N5-08: Bu yerda seni hech kim qoʻngʻiroq bilan bezor qilmaydi.

endings:
  EA-01: Mana kalit. Tok ba’zan oʻchib turadi.
  EA-02: Qoʻshni… uxlamayapsizmi?
  EC-02: Alo… bolam?
